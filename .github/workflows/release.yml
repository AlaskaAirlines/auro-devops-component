name: Release Workflow

on:
  push:
    branches:
      - 'rc/**'
      - 'main'

permissions:
  id-token: write  # required for OIDC (npm provenance)
  contents: read

jobs:
  action:
    uses: AlaskaAirlines/auro-actions/.github/workflows/release.yml@dev
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}